[package]
name = "survivor"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "survivor: the survivor-like's launcher, the benilla client wired to its in-process pretend server"
publish = false

[lints]
workspace = true

[features]
default = ["dev"]
dev = ["benilla-app/dev"]

[dependencies]
benilla-app = { path = "../benilla-app", default-features = false }
survivor-server = { path = "../survivor-server" }
survivor-ui = { path = "../survivor-ui" }

[build-dependencies]
benilla-buildstamp = { path = "../benilla-buildstamp" }

[[bin]]
name = "survivor"
path = "src/main.rs"
test = false
