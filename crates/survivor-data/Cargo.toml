[package]
name = "survivor-data"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "survivor: extracts the world rows the pretend server needs (spawns, creatures, starting gear) from vmangos's SQLite world database"
publish = false

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
benilla-adt = { path = "../benilla-adt" }
benilla-formats = { path = "../benilla-formats", default-features = false }
rusqlite = { version = "0.32", features = ["bundled"] }
survivor-server = { path = "../survivor-server" }
