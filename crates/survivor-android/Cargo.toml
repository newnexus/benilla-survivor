[package]
name = "survivor-android"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "survivor-android: the survivor-like as an Android app (the library its GameActivity loads)"
publish = false

[lints]
workspace = true

[lib]
name = "survivor_android"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
benilla-app = { path = "../benilla-app", default-features = false }
bevy.workspace = true
survivor-server = { path = "../survivor-server" }
survivor-touch = { path = "../survivor-touch" }
survivor-ui = { path = "../survivor-ui" }

[build-dependencies]
benilla-buildstamp = { path = "../benilla-buildstamp" }
